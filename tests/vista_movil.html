<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista móvil (390 px) · prueba manual</title>
<style>
  body{margin:0;padding:16px;background:#e9eef4;font:14px system-ui,Segoe UI,Arial,sans-serif;color:#14202e}
  h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;color:#4d5b6b}
  .phones{display:flex;gap:18px;flex-wrap:wrap}
  figure{margin:0}figcaption{font-weight:600;margin:6px 0;text-align:center}
  iframe{width:390px;height:844px;border:10px solid #14202e;border-radius:28px;background:#fff}
</style></head>
<body>
<h1>Ernesto Investing AI · vista móvil a 390 px</h1>
<p>Herramienta de prueba del equipo: cada iframe tiene exactamente 390 px de ancho. Uso: <code>tests/vista_movil.html?p=portafolios,clasificacion,regresion&amp;theme=light</code></p>
<div class="phones" id="ph"></div>
<script>
  const q = new URLSearchParams(location.search);
  const pages = (q.get("p") || "portafolios,clasificacion,backtesting").split(",");
  const theme = q.get("theme") || "light", lang = q.get("lang") || "es";
  document.getElementById("ph").innerHTML = pages.map(p =>
    `<figure><figcaption>${p}.html</figcaption><iframe title="${p} a 390 px" src="../${p}.html?theme=${theme}&lang=${lang}"></iframe></figure>`).join("");
</script>
</body></html>
